services:
  db:
    image: postgres:16-alpine
    container_name: meowpay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meowpay
      POSTGRES_PASSWORD: meowpay
      POSTGRES_DB: meowpay
    ports:
      - "5432:5432"
    volumes:
      - meowpay-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meowpay -d meowpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    container_name: meowpay-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      # `db` is the compose service name, resolvable on the default network.
      DATABASE_URL: postgres://meowpay:meowpay@db:5432/meowpay
      # Dev-only secret — generate and inject a real one for any shared/prod environment.
      JWT_SECRET: dev-only-change-me
    volumes:
      - ./backend:/app
      # Anonymous volume shadows the bind mount at this path, keeping the
      # container's own node_modules (installed by `npm ci` in the dev stage)
      # instead of whatever is (or isn't) on the host.
      - /app/node_modules
    ports:
      - "3000:3000"

volumes:
  meowpay-db-data:
